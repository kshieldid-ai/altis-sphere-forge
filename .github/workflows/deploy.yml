name: Deploy React Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # IMPORTANT : aucune variable VITE_* n'est injectee ici.
      # Elles proviennent des fichiers .env versionnes
      # (.env + .env.production, fusionnes par Vite en mode build).
      # Ne PAS ajouter `env: VITE_API_URL: ${{ secrets.X }}` :
      # si le secret n'existe pas, GitHub rend une chaine VIDE qui
      # ecrase la valeur du .env (process.env est prioritaire sur .env
      # dans Vite) -> URL d'API vide -> formulaires casses.
      - name: Build
        run: npm run build

      - name: Verify build (fail fast)
        run: |
          test -f dist/index.html   || { echo "index.html manquant"; exit 1; }
          test -f dist/CNAME        || { echo "CNAME manquant"; exit 1; }
          test -f dist/og-image.png || { echo "og-image.png manquant"; exit 1; }
          ls dist/assets/altis-logo-*.png >/dev/null \
            || { echo "LOGO ABSENT DU BUNDLE"; exit 1; }

          # --- Backend Django : l'URL de prod doit etre inlinee ---
          grep -rq "affagripel-lualaba.com/api/altis" dist/assets/ \
            || { echo "URL API ABSENTE DU BUNDLE -> formulaires HS"; exit 1; }
          ! grep -rq "localhost:8000" dist/assets/ \
            || { echo "URL LOCALE DANS LE BUNDLE -> .env.production ignore"; exit 1; }

          # --- Domaine et residus ---
          grep -rq "altisphere-group.com" dist/index.html \
            || { echo "Domaine de production absent de index.html"; exit 1; }
          ! grep -rq "__l5e" dist/ \
            || { echo "URL Lovable (__l5e) residuelle dans dist/"; exit 1; }
          ! grep -rq "altis-sphere-forge.lovable.app" dist/ \
            || { echo "Domaine Lovable residuel dans dist/"; exit 1; }
          ! grep -rq "altissphere.com" dist/ \
            || { echo "Ancien email hors domaine dans dist/"; exit 1; }
          ! grep -rq "supabase.co" dist/assets/ \
            || { echo "RESIDU SUPABASE dans le bundle"; exit 1; }

          echo "Build verifie."

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4